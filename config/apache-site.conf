<VirtualHost *:10000>
    ServerName localhost
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Сайт сам управляет доступом через .htaccess (в том числе /login → /admin/).
    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Constant storage with backups: закрываем и напрямую, и через симлинки.
    <Directory /var/www/html/storage>
        Require all denied
    </Directory>

    <Directory /var/www/html/data>
        Require all denied
    </Directory>

    <Directory /var/www/html/lib>
        Require all denied
    </Directory>

    <Directory /var/www/html/templates>
        Require all denied
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
